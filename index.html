<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerLaunch - 100% Free</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial, Helvetica, sans-serif;
background:#f4f7fb;
color:#1e293b;
}

header{
background:#1e3a8a;
color:white;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{font-size:20px}
nav a{
color:white;
margin-left:15px;
text-decoration:none;
font-weight:bold;
}

section{padding:50px 8%}

.hero{
text-align:center;
padding:80px 8%;
background:#1e3a8a;
color:white;
}

.hero h2{font-size:32px;margin-bottom:15px}

.btn{
background:#14b8a6;
color:white;
padding:10px 20px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
}

input, select, textarea{
width:100%;
padding:8px;
margin-bottom:10px;
border-radius:5px;
border:1px solid #ccc;
}

.jobs{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:white;
padding:15px;
border-radius:8px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.resume-preview{
background:white;
padding:15px;
border-radius:8px;
min-height:150px;
border:1px solid #ccc;
white-space:pre-line;
}

.kanban{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.column{
background:#e2e8f0;
padding:10px;
border-radius:8px;
min-height:150px;
}

.task{
background:white;
padding:8px;
border-radius:6px;
margin-bottom:8px;
cursor:grab;
}

footer{
text-align:center;
padding:20px;
background:#1e3a8a;
color:white;
}
</style>
</head>

<body>

<header>
<h1>CareerLaunch</h1>
<nav>
<a href="#jobs">Jobs</a>
<a href="#resume">Resume</a>
<a href="#tracker">Tracker</a>
</nav>
</header>

<section class="hero">
<h2>Land Your Dream Job Faster</h2>
<p>Completely free. No signups. No payments. Works offline.</p>
<button class="btn" onclick="document.getElementById('jobs').scrollIntoView()">Browse Jobs</button>
</section>

<section id="jobs">
<h2>Job Search</h2>
<input type="text" id="search" placeholder="Search job title">
<select id="locationFilter">
<option value="">All Locations</option>
<option>Remote</option>
<option>New York</option>
<option>San Francisco</option>
</select>

<div class="jobs" id="jobsContainer"></div>
</section>

<section id="resume">
<h2>Resume Builder</h2>

<input id="name" placeholder="Full Name">
<input id="title" placeholder="Professional Title">
<textarea id="skills" placeholder="Skills (comma separated)"></textarea>
<textarea id="experience" placeholder="Work Experience"></textarea>

<button class="btn" onclick="generateResume()">Generate Resume</button>
<button class="btn" onclick="downloadResume()">Download Resume (.txt)</button>

<h3>Preview</h3>
<div class="resume-preview" id="resumePreview"></div>
</section>

<section id="tracker">
<h2>Application Tracker</h2>

<div class="kanban">
<div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
<h4>Applied</h4>
</div>
<div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
<h4>Interview</h4>
</div>
<div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
<h4>Offer</h4>
</div>
<div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
<h4>Rejected</h4>
</div>
</div>

<input id="taskInput" placeholder="Add job application">
<button class="btn" onclick="addTask()">Add</button>

</section>

<footer>
© 2026 CareerLaunch - 100% Free & Open
</footer>

<script>

/* ---------------- JOB DATA ---------------- */

const jobs = [
{title:"Frontend Developer",location:"Remote",salary:"$80k"},
{title:"Backend Developer",location:"New York",salary:"$100k"},
{title:"UI/UX Designer",location:"San Francisco",salary:"$90k"},
{title:"Data Analyst",location:"Remote",salary:"$85k"}
];

const container=document.getElementById("jobsContainer");

function displayJobs(list){
container.innerHTML="";
list.forEach((job,index)=>{
const div=document.createElement("div");
div.className="card";
div.innerHTML=`
<h4>${job.title}</h4>
<p>${job.location}</p>
<p>${job.salary}</p>
<button class="btn" onclick="saveJob(${index})">Save</button>
`;
container.appendChild(div);
});
}

displayJobs(jobs);

document.getElementById("search").addEventListener("input",filterJobs);
document.getElementById("locationFilter").addEventListener("change",filterJobs);

function filterJobs(){
const keyword=document.getElementById("search").value.toLowerCase();
const location=document.getElementById("locationFilter").value;

const filtered=jobs.filter(job=>{
return job.title.toLowerCase().includes(keyword) &&
(location===""||job.location===location);
});

displayJobs(filtered);
}

function saveJob(index){
let saved=JSON.parse(localStorage.getItem("savedJobs"))||[];
saved.push(jobs[index]);
localStorage.setItem("savedJobs",JSON.stringify(saved));
alert("Job saved locally!");
}

/* ---------------- RESUME ---------------- */

function generateResume(){
const name=document.getElementById("name").value;
const title=document.getElementById("title").value;
const skills=document.getElementById("skills").value;
const experience=document.getElementById("experience").value;

const resumeText=
`${name}
${title}

Skills:
${skills}

Experience:
${experience}`;

document.getElementById("resumePreview").textContent=resumeText;
}

function downloadResume(){
const text=document.getElementById("resumePreview").textContent;
const blob=new Blob([text],{type:"text/plain"});
const link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="resume.txt";
link.click();
}

/* ---------------- KANBAN ---------------- */

function allowDrop(ev){ev.preventDefault();}

function drag(ev){ev.dataTransfer.setData("text",ev.target.id);}

function drop(ev){
ev.preventDefault();
const data=ev.dataTransfer.getData("text");
ev.target.closest(".column").appendChild(document.getElementById(data));
}

function addTask(){
const text=document.getElementById("taskInput").value;
if(!text)return;

const div=document.createElement("div");
div.className="task";
div.id="task"+Date.now();
div.draggable=true;
div.ondragstart=drag;
div.innerText=text;

document.querySelector(".column").appendChild(div);
document.getElementById("taskInput").value="";
}

</script>

</body>
</html>
